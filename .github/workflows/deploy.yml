name: Build and Deploy to Ferozo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el Build
        run: npm run build

      - name: Verificar el bundle
        run: test -f dist/index.html

      - name: Subir archivos a Ferozo (vía lftp)
        run: |
          sudo apt-get update
          sudo apt-get install lftp -y
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          set ftp:passive-mode true;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          mirror -R -e -v ./dist/ /public_html/
          "